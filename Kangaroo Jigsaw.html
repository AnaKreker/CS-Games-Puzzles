<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kangaroo Jigsaw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: heading, level buttons, one play area. Wide screens: picture board left, loose pieces right. Narrow: board on top, loose pieces below. */
:root{
  --bg:#FFFDF7; --fg:#2B2D42; --muted:#5A5E7A; --surface:#FFFFFF; --line:#E4DFD0;
  --accent:#2EC4B6; --on-accent:#16303A; --blue:#4D96FF; --orange:#B86A00;
  --board-bg:#E6F7F5; --board-ring:#BFEDE8; --dash:#8FD6CF; --tray-bg:#EEF3FF;
  --display:'Fredoka',system-ui,sans-serif; --body:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1E2E; --fg:#FFFDF7; --muted:#B8BBD0; --surface:#272A3F; --line:#3A3E5A;
    --accent:#2EC4B6; --on-accent:#10242B; --blue:#7DB0FF; --orange:#FF9F1C;
    --board-bg:#1E3A3B; --board-ring:#2C6460; --dash:#3F8681; --tray-bg:#232842;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1E2E; --fg:#FFFDF7; --muted:#B8BBD0; --surface:#272A3F; --line:#3A3E5A;
  --accent:#2EC4B6; --on-accent:#10242B; --blue:#7DB0FF; --orange:#FF9F1C;
  --board-bg:#1E3A3B; --board-ring:#2C6460; --dash:#3F8681; --tray-bg:#232842;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 28px;
}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin:18px 0 10px}
.seg,.acts{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;min-height:44px;padding:8px 16px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;
}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:bold}
.msg{margin:0 0 12px;min-height:1.5em;font-weight:bold}

.play{position:relative;width:100%;overflow-x:clip}
.board{position:absolute;z-index:0;border-radius:6px;background:var(--board-bg);box-shadow:0 0 0 3px var(--board-ring);overflow:hidden}
.ghost{position:absolute;inset:0;background-image:var(--photo);background-repeat:no-repeat;opacity:.3;transition:opacity .2s}
.play[data-hint="off"] .ghost{opacity:0}
.cell{position:absolute;border:1.5px dashed var(--dash)}
.tray{position:absolute;z-index:0;border-radius:12px;background:var(--tray-bg)}
.piece{
  position:absolute;pointer-events:none;
  filter:drop-shadow(0 3px 3px rgba(20,22,40,.30));
  transition:left .16s ease,top .16s ease,transform .12s ease;
}
.piece.drag{transition:none;transform:scale(1.05);filter:drop-shadow(0 9px 8px rgba(20,22,40,.35))}
.piece.locked{filter:none}
.clip{position:absolute;inset:0;pointer-events:auto;cursor:grab;touch-action:none;background-image:var(--photo);background-repeat:no-repeat}
.piece.drag .clip{cursor:grabbing}
.piece.locked .clip{pointer-events:none;cursor:default}
.clip svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s}
.whole{position:absolute;z-index:3;pointer-events:none;border-radius:6px;opacity:0;transition:opacity .7s ease;background-image:var(--photo);background-repeat:no-repeat}
.play.done .whole{opacity:1}
.play.done .clip svg{opacity:0}
.fact{margin:16px 0 0;padding:14px 18px;border-radius:12px;background:var(--fact-bg);border:2px solid var(--fact-line);max-width:60ch;font-size:20px;line-height:1.45}
#hint{background:var(--hint-bg);border-color:var(--hint-line)}
#again{background:var(--again-bg);border-color:var(--again-line)}
#hint,#again{border-width:3px;transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}
#hint:hover{background:var(--hint-hover);border-color:var(--hint-strong)}
#again:hover{background:var(--again-hover);border-color:var(--again-strong)}
#hint:hover,#again:hover{transform:translateY(-3px) scale(1.07);box-shadow:0 6px 0 var(--btn-shadow)}
#hint:active,#again:active{transform:translateY(1px) scale(.97);box-shadow:none}
@media (prefers-reduced-motion: reduce){#hint:hover,#again:hover,#hint:active,#again:active{transform:none}}
.fact b{display:block;margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.15;color:var(--orange)}
:root{--fact-bg:#E6F6DF;--fact-line:#BFE3B0;--hint-bg:#DDF4D0;--hint-line:#9FD98A;--again-bg:#FFF2BF;--again-line:#FFD23F;--hint-hover:#A6E28C;--hint-strong:#2E9E55;--again-hover:#FFD23F;--again-strong:#D99A00;--btn-shadow:rgba(43,45,66,.22)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fact-bg:#1F3326;--fact-line:#35573E;--hint-bg:#24402B;--hint-line:#3DB86A;--again-bg:#3E3619;--again-line:#C9A21A;--hint-hover:#2F6A3C;--hint-strong:#6FD68F;--again-hover:#6B5A14;--again-strong:#FFD23F;--btn-shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--fact-bg:#1F3326;--fact-line:#35573E;--hint-bg:#24402B;--hint-line:#3DB86A;--again-bg:#3E3619;--again-line:#C9A21A;--hint-hover:#2F6A3C;--hint-strong:#6FD68F;--again-hover:#6B5A14;--again-strong:#FFD23F;--btn-shadow:rgba(0,0,0,.45)}
.credit{margin:18px 0 0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){
  .piece,.clip svg,.whole,.ghost{transition:none}
  .piece.drag{transform:none}
}
</style>

<main class="wrap">
  <header>
    <h1>Kangaroo jigsaw</h1>
    <p class="lead">Press and hold a piece, drag it onto the picture, then let go. It clicks into place when it fits.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Number of pieces">
      <button type="button" data-n="4" aria-pressed="true">4 pieces</button>
      <button type="button" data-n="6" aria-pressed="false">6 pieces</button>
      <button type="button" data-n="12" aria-pressed="false">12 pieces</button>
    </div>
    <div class="acts">
      <button type="button" id="hint" aria-pressed="true">Hint: on</button>
      <button type="button" id="again">Start over</button>
    </div>
  </div>

  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <div id="play" class="play" data-hint="on"></div>
  <p id="fact" class="fact" hidden><b>Fun fact</b>A baby kangaroo is called a joey. When it is born it is only about as big as a jellybean, and it grows up inside its mom's pouch.</p>
  <p class="credit">Photo from Pexels.</p>
  
</main>

var IW=800, IH=1200, FX=0.55, FY=0.55, TOP=10, GAP=24;

var play=document.getElementById('play'), msg=document.getElementById('msg'), fact=document.getElementById('fact');

function mk(tag,cls,css){
  var el=document.createElement(tag);
  if(cls) el.className=cls;
  if(css) for(var k in css) el.style[k]=css[k]+'px';
  return el;
}

function edge(A,B,n,d){
  if(!d) return 'L'+B[0]+' '+B[1]+' ';
  var ex=(B[0]-A[0])/s, ey=(B[1]-A[1])/s;
  function P(u,v){
    return (A[0]+ex*u*s+n[0]*v*s*d).toFixed(1)+' '+(A[1]+ey*u*s+n[1]*v*s*d).toFixed(1);
  }
  return 'L'+P(.40,0)+' C'+P(.40,.06)+' '+P(.42,.06)+' '+P(.42,.10)
    +' C'+P(.42,.13)+' '+P(.32,.12)+' '+P(.32,.18)
    +' C'+P(.32,.25)+' '+P(.42,.28)+' '+P(.5,.28)
    +' C'+P(.58,.28)+' '+P(.68,.25)+' '+P(.68,.18)
    +' C'+P(.68,.12)+' '+P(.58,.13)+' '+P(.58,.10)
    +' C'+P(.58,.06)+' '+P(.60,.06)+' '+P(.60,0)
    +' L'+P(1,0)+' ';
}

function piecePath(r,c,rows,cols){
  var x0=pad,y0=pad,x1=pad+s,y1=pad+s;
  var top=r?-hArr[r-1][c]:0;
  var bottom=r<rows-1?hArr[r][c]:0;
  var left=c?-vArr[r][c-1]:0;
  var right=c<cols-1?vArr[r][c]:0;
  return 'M'+x0+' '+y0+' '
    +edge([x0,y0],[x1,y0],[0,-1],top)
    +edge([x1,y0],[x1,y1],[1,0],right)
    +edge([x1,y1],[x0,y1],[0,1],bottom)
    +edge([x0,y1],[x0,y0],[-1,0],left)+'Z';
}

function sign(){ return Math.random()<.5?1:-1; }

function setup(){
  play.innerHTML=''; play.classList.remove('done'); fact.hidden=true;
  drag=null; placed=0; pieces=[];
  W=Math.floor(play.clientWidth)||320; lastW=W;
  var lv=LEVELS[level], cols=lv[0], rows=lv[1];
  total=cols*rows;
  var side=W>=640;
  var maxH=side?440:300, maxW=side?Math.floor(W*.48):Math.min(W,340);
  s=Math.floor(Math.min(maxW/cols,maxH/rows));
  var Bw=s*cols, Bh=s*rows;
  pad=Math.round(s*.28)+3; bs=s+2*pad;

  var bx,by=TOP,tx,ty,tw,th;
  if(side){ bx=0; tx=Bw+GAP; ty=TOP; tw=W-tx; th=Bh; }
  else { bx=Math.round((W-Bw)/2); tx=0; ty=TOP+Bh+22; tw=W; th=0; }
  board={x:bx,y:by,w:Bw,h:Bh};

  var inner=tw-16;
  var colsT=Math.max(1,Math.min(total,Math.floor(inner/(s*.85))));
  var rowsT=Math.ceil(total/colsT);
  var stepX=colsT>1?(inner-s)/(colsT-1):0;
  var x0=colsT>1?8:(tw-s)/2;
  var stepY,y0;
  if(side){
    stepY=rowsT>1?Math.min(s*.95,(th-s-16)/(rowsT-1)):0;
    y0=rowsT>1?8:(th-s)/2;
  } else {
    stepY=s*.88; y0=8;
    th=Math.round((rowsT-1)*stepY+s+16);
  }
  H=side?(TOP*2+Math.max(Bh,th)):(ty+th+TOP);
  play.style.height=H+'px';

  var sc=Math.max(Bw/IW,Bh/IH), iw=IW*sc, ih=IH*sc;
  var ox=Math.min(0,Math.max(Bw-iw,Bw/2-FX*iw));
  var oy=Math.min(0,Math.max(Bh-ih,Bh/2-FY*ih));
  var bgSize=iw+'px '+ih+'px';

  // board with faded hint picture and dashed cells
  var bd=mk('div','board',{left:bx,top:by,width:Bw,height:Bh});
  var ghost=mk('div','ghost');
  ghost.style.backgroundSize=bgSize; ghost.style.backgroundPosition=ox+'px '+oy+'px';
  bd.appendChild(ghost);
  for(var rr=0;rr<rows;rr++) for(var cc=0;cc<cols;cc++){
    bd.appendChild(mk('div','cell',{left:cc*s,top:rr*s,width:s,height:s}));
  }
  play.appendChild(bd);
  play.appendChild(mk('div','tray',{left:tx,top:ty,width:tw,height:th}));

  var whole=mk('div','whole',{left:bx,top:by,width:Bw,height:Bh});
  whole.style.backgroundSize=bgSize; whole.style.backgroundPosition=ox+'px '+oy+'px';
  play.appendChild(whole);

  // random knob directions shared between neighbours
  hArr=[]; vArr=[];
  for(var r=0;r<rows;r++){
    hArr.push([]); vArr.push([]);
    for(var c=0;c<cols;c++){ hArr[r].push(sign()); vArr[r].push(sign()); }
  }

  var order=[];
  for(var i=0;i<total;i++) order.push(i);
  for(var j=order.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1)), tmp=order[j]; order[j]=order[k]; order[k]=tmp;
  }

  order.forEach(function(idx,slot){
    var r=Math.floor(idx/cols), c=idx%cols;
    var d=piecePath(r,c,rows,cols);
    var el=mk('div','piece',{width:bs,height:bs});
    var clip=mk('div','clip');

    clip.style.backgroundSize=bgSize;
    clip.style.backgroundPosition=(ox-c*s+pad)+'px '+(oy-r*s+pad)+'px';
    clip.innerHTML='<svg viewBox="0 0 '+bs+' '+bs+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4" stroke-linejoin="round"/></svg>';
    el.appendChild(clip);
    var col=slot%colsT, row=Math.floor(slot/colsT);
    var jx=Math.round((Math.random()-.5)*s*.08), jy=Math.round((Math.random()-.5)*s*.08);
    var p={r:r,c:c,el:el,locked:false,
      tx:bx+c*s-pad, ty:by+r*s-pad,
      x:tx+x0+col*stepX-pad+jx, y:ty+y0+row*stepY-pad+jy};
    el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.zIndex=10+slot;
    pieces.push(p);
    wire(clip,p);
    play.appendChild(el);
  });

  msg.textContent='0 of '+total+' pieces placed. Drag a piece onto the picture.';
}

function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

function wire(clip,p){
  clip.addEventListener('pointerdown',function(e){
    if(p.locked||drag) return;
    e.preventDefault();
    try{ clip.setPointerCapture(e.pointerId); }catch(err){}
    var pr=play.getBoundingClientRect();
    drag={p:p,id:e.pointerId,ox:e.clientX-pr.left-p.x,oy:e.clientY-pr.top-p.y};
    p.el.classList.add('drag');
    p.el.style.zIndex=++z;
    msg.textContent='Drag it to where it fits on the picture.';
  });
  clip.addEventListener('pointermove',function(e){
    if(!drag||drag.p!==p||e.pointerId!==drag.id) return;
    var pr=play.getBoundingClientRect();
    p.x=clamp(e.clientX-pr.left-drag.ox,-pad,W-bs+pad);
    p.y=clamp(e.clientY-pr.top-drag.oy,-pad,H-bs+pad);
    p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px';
  });
  function up(e){
    if(!drag||drag.p!==p||e.pointerId!==drag.id) return;
    drag=null;
    p.el.classList.remove('drag');
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<s*.45){ lock(p); return; }
    var cx=p.x+bs/2, cy=p.y+bs/2;
    if(cx>board.x&&cx<board.x+board.w&&cy>board.y&&cy<board.y+board.h){
      msg.textContent='Not quite. Look at the faded picture and try another spot.';
    } else {
      msg.textContent=placed+' of '+total+' pieces placed.';
    }
  }
  clip.addEventListener('pointerup',up);
  clip.addEventListener('pointercancel',up);
}

function lock(p){
  p.x=p.tx; p.y=p.ty;
  p.el.style.left=p.x+'px'; p.el.style.top=p.y+'px';
  p.el.classList.add('locked');
  p.el.style.zIndex=2;
  p.locked=true; placed++;
  if(placed===total){
    play.classList.add('done');
    msg.textContent='You did it! The whole picture is back together.';
    fact.hidden=false;
  } else {
    msg.textContent='Nice! '+placed+' of '+total+' pieces placed.';
  }
}

// level buttons
Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
  b.addEventListener('click',function(){
    level=+b.getAttribute('data-n');
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(o){
      o.setAttribute('aria-pressed',o===b?'true':'false');
    });
    setup();
  });
});
document.getElementById('again').addEventListener('click',setup);
var hintBtn=document.getElementById('hint');
hintBtn.addEventListener('click',function(){
  var on=play.getAttribute('data-hint')!=='on';
  play.setAttribute('data-hint',on?'on':'off');
  hintBtn.setAttribute('aria-pressed',on?'true':'false');
  hintBtn.textContent='Hint: '+(on?'on':'off');
});

setup();
if(window.ResizeObserver){
  new ResizeObserver(function(){
    var w=Math.floor(play.clientWidth);
    if(Math.abs(w-lastW)>2 && !drag) setup();
  }).observe(play);
}
})();
</script>
