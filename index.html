<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ms. Ana's CS Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    :root {
      --turquoise: #0ADF97;
      --blue: #1D71B8;
      --orange: #E48900;
      --purple: #C869ED;
      --yellow: #ECCD00;
      --navy: #01153E;
      --cream: #FFFDF7;
      --pink: #E06C98; 
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      font-family: Arial, sans-serif;
      color: var(--navy);
    }
    header {
      text-align: center;
      padding: 28px 16px 8px;
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.6rem;
      margin: 0;
      display: inline-block;
      padding: 10px 28px;
      border: 4px dashed var(--turquoise);
      border-radius: 24px;
    }
    header p {
      font-family: 'Fredoka', sans-serif;
      color: var(--purple);
      font-size: 1.3rem;
      margin: 12px 0 0;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }
    h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.7rem;
      margin: 28px 0 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 150px;
      padding: 16px;
      border-radius: 22px;
      border: 4px solid #fff;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.45), 0 4px 0 rgba(0,0,0,0.08);
      color: #fff;
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      text-align: center;
      transition: transform 0.15s;
    }
    .card:hover, .card:focus { transform: translateY(-4px) scale(1.03); }
    .card .icon { font-size: 3rem; line-height: 1; }
    .card .icon img { width: 4.5rem; height: auto; display: block; }
    .turquoise { background: var(--turquoise); }
    .blue      { background: var(--blue); }
    .orange    { background: var(--orange); }
    .purple    { background: var(--purple); }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.9rem;
      color: var(--purple);
    }
    .featured { margin: 18px 0 4px; }
    .featured .label { font-family: 'Fredoka', sans-serif; font-size: 1.7rem; margin: 0 0 12px; }
    .card.big { flex-direction: row; gap: 24px; min-height: 190px; font-size: 2.6rem; }
    .card.big .icon { font-size: 6rem; }
    .card.big .icon svg { width: 130px; height: 130px; }
    .card.big .icon img { width: 8rem; }
  </style>
</head>
<body>

  <header>
    <h1>⭐ Ms. Ana's CS Games ⭐</h1>
    <p>Pick a game and have fun!</p>
  </header>

  <main id="games"></main>

  <footer>Jefferson Elementary · Computer Science</footer>

  <script>
    // ✏️ To add a game: copy a line and change the title, file, and icon.
    // "file" must match the game's file name in your repository.
    // ⭐ Big button at the top. Change the title, or use "" for none.
    //const FEATURED = "Robot to the Snack";

    const sections = [

      {
        title: "🤖 Programming Basics",
        color: "purple",
        games: [
          { title: "Robot to the Snack", file: "programming/robot-to-the-snack.html", icon: `<svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><line x1="50" y1="20" x2="50" y2="8" stroke="#fff" stroke-width="7" stroke-linecap="round"/><line x1="50" y1="20" x2="50" y2="8" stroke="#4D96FF" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="8" r="7" fill="#FFD23F" stroke="#fff" stroke-width="3"/><rect x="14" y="20" width="72" height="62" rx="22" fill="#4D96FF" stroke="#fff" stroke-width="5"/><rect x="19" y="25" width="62" height="52" rx="17" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/><rect x="25" y="32" width="50" height="34" rx="13" fill="#FFFDF7"/><circle cx="40" cy="46" r="4.5" fill="#2B2D42"/><circle cx="60" cy="46" r="4.5" fill="#2B2D42"/><circle cx="33" cy="55" r="4" fill="#F7A8B8"/><circle cx="67" cy="55" r="4" fill="#F7A8B8"/><path d="M44 55q6 5 12 0" stroke="#2B2D42" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="22" y="80" width="18" height="12" rx="6" fill="#2EC4B6" stroke="#fff" stroke-width="3"/><rect x="60" y="80" width="18" height="12" rx="6" fill="#2EC4B6" stroke="#fff" stroke-width="3"/></svg>` },
          { title: "Daily Routine Order", file: "programming/daily-routine-order.html", icon: "⏰" }
        ]
      },
      {
        title: "🔤 Alphabet Games",
        color: "turquoise",
        games: [
          { title: "Alphabet Puzzle", file: "alphabet-games/alphabet-puzzle.html", icon: "🧩" },
          { title: "Alphabet Match",  file: "alphabet-games/alphabet-match.html",  icon: "🔠" },
          { title: "Alphabet Jigsaw", file: "alphabet-games/alphabet-jigsaw.html", icon: "🅰️" },
          { title: "Balloon Pop", file: "alphabet-games/alphabet-balloons.html", icon: "🎈" }
        ]
      },
      
      {
        title: "🦁 Animal Jigsaws",
        color: "orange",
        games: [
          { title: "Monkey",    file: "puzzles/monkey-jigsaw.html",    icon: "🐒" },
          { title: "Lion Cub",  file: "puzzles/lion-cub-jigsaw.html",  icon: "🦁" },
          { title: "Lemur",     file: "puzzles/lemur-jigsaw.html",     icon: '<img src="lemur-transparent-icon.png" alt="">' },
          { title: "Orangutan", file: "puzzles/orangutan-jigsaw.html", icon: "🦧" },
          { title: "Giraffe",   file: "puzzles/giraffe-jigsaw.html",   icon: "🦒" },
          { title: "Zebra",     file: "puzzles/zebra-jigsaw.html",     icon: "🦓" },
          { title: "Elephant",  file: "puzzles/elephant-jigsaw.html",  icon: "🐘" },
          { title: "Kangaroo",  file: "puzzles/kangaroo-jigsaw.html",  icon: "🦘" },
          { title: "Warthog",   file: "puzzles/warthog-jigsaw.html",   icon: "🐗" },
          { title: "Tiger",     file: "puzzles/tiger-jigsaw.html",     icon: "🐯" }
        ]
      },

               {
        title: "🍎 Play with a Teacher",
        color: "purple",
        games: [
          { title: "Help the Squirrel!", file: "play-with-teacher/squirrel-game.html", icon: "🐿️" }
          { title: "Collect & Repeat", file: "play-with-teacher/collect-and-repeat.html", icon: "🐢" }
        ]
      }
      
    ];

 

    const main = document.getElementById("games");
    // ⭐ Today's game: a big button at the top
    sections.forEach(section => section.games.forEach(game => {
      if (game.title !== FEATURED) return;
      const box = document.createElement("section");
      box.className = "featured";
      box.innerHTML = `<h2 class="label">⭐ Today's game</h2>`;
      const a = document.createElement("a");
      a.className = "card big " + section.color;
      a.href = game.file;
      a.innerHTML = `<span class="icon">${game.icon}</span>${game.title}`;
      box.appendChild(a);
      main.appendChild(box);
    }));
    sections.forEach(section => {
      const h2 = document.createElement("h2");
      h2.textContent = section.title;
      main.appendChild(h2);

      const grid = document.createElement("div");
      grid.className = "grid";
      section.games.forEach(game => {
        const a = document.createElement("a");
        a.className = "card " + section.color;
        a.href = game.file;
        a.innerHTML = `<span class="icon">${game.icon}</span>${game.title}`;
        grid.appendChild(a);
      });
      main.appendChild(grid);
    });
  </script>

</body>
</html>
