  --mat:#2E2620; --mat-line:#3A3028; --ink:#F6EBD9; --ink-soft:#CDB896;
  --chip:#3E342B; --accent:#FFB347; --star-off:#55473A; --back:#4B6FE8; --back-dot:#6787F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --mat:#2E2620; --mat-line:#3A3028; --ink:#F6EBD9; --ink-soft:#CDB896;
  --chip:#3E342B; --accent:#FFB347; --star-off:#55473A; --back:#4B6FE8; --back-dot:#6787F0; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--mat);color:var(--ink);font-family:var(--body);
  background-image:repeating-linear-gradient(178deg,transparent 0 34px,var(--mat-line) 34px 37px,transparent 37px 71px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;box-sizing:border-box}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,34px);margin:0;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:var(--display);font-weight:600;font-size:17px;border:3px solid var(--ink);border-radius:999px;
  padding:8px 16px;background:var(--chip);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,.choice:focus-visible,.mcard:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modes{gap:8px}
.label{font-family:var(--display);font-weight:500;color:var(--ink-soft);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.stars{display:flex;gap:4px;flex-wrap:wrap}
.stars svg{width:clamp(20px,4vw,30px);height:auto}
.stars path{fill:var(--star-off);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.stars .on path{fill:var(--star)}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.prompt{background:var(--card);border:4px solid var(--ink);border-radius:30px;box-shadow:0 6px 0 var(--ink);
  width:min(300px,70vw);aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;box-sizing:border-box;position:relative;transition:transform .15s}
.prompt img{max-width:82%;max-height:74%;object-fit:contain;pointer-events:none;user-select:none}
.prompt.hot{transform:scale(1.04);outline:4px dashed var(--accent);outline-offset:6px}
.word{font-family:var(--display);font-weight:600;font-size:clamp(22px,4vw,30px);color:#2B2D42;min-height:1.2em}
.say{position:absolute;right:-10px;top:-14px;padding:6px 12px;font-size:15px}
.ask{font-family:var(--display);font-weight:600;font-size:clamp(20px,3.6vw,26px);margin:0;text-align:center;text-wrap:balance}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.5vw,22px)}
.choice{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);
  width:clamp(96px,22vw,170px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;
  padding:10px;box-sizing:border-box;transition:transform .15s,opacity .2s;user-select:none}
.choice img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.choice.dragging{cursor:grabbing;box-shadow:0 14px 18px rgba(0,0,0,.25);z-index:5;transition:none}
.choice.wrong{opacity:.35;animation:shake .4s}
.choice.right{border-color:var(--good);box-shadow:0 5px 0 var(--good);transform:scale(1.08)}
@keyframes shake{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.prompt.yay{animation:pop .45s}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);width:min(640px,100%)}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{aspect-ratio:1/1;border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0;position:relative;background:transparent;perspective:600px}
.mcard .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.face.back{background:var(--back);background-image:radial-gradient(var(--back-dot) 22%,transparent 24%);background-size:22px 22px}
.face.back span{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,42px);color:#FFFFFF}
.face.front{background:var(--card);transform:rotateY(180deg);padding:10%;box-sizing:border-box}
.face.front img{max-width:100%;max-height:100%;object-fit:contain}
.mcard.done{border-color:var(--good);box-shadow:0 4px 0 var(--good);cursor:default}
.win{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:22px 28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:#2B2D42}
.win h2{font-family:var(--display);font-size:clamp(28px,6vw,44px);margin:0}
.win p{margin:0;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const KEYS=Object.keys(DATA); // 25 letters (A–Z without D)
const ROUND=10;
let mode='p2l', nChoices=3, sound=true, q=0, queue=[], locked=false, actx=null;
const $=s=>document.querySelector(s);
const stage=$('#stage');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const STAR='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 11 12 1.3-9 8.2 2.6 11.8L20 29.5 9.4 35.3 12 23.5 3 15.3 15 14z"/></svg>';

function blip(f,d,type='triangle'){ if(!sound) return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.16,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(_){}}
function cheer(){[523,659,784].forEach((f,i)=>setTimeout(()=>blip(f,.22),i*90));}
function say(text){ if(!sound) return; try{const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.85; u.pitch=1.1; s.speak(u);}catch(_){}}
const sentence=k=>`${k} is for ${DATA[k].word}`;

function drawStars(n,total){ const el=$('#stars'); el.innerHTML=''; for(let i=0;i<total;i++){const s=document.createElement('span');s.innerHTML=STAR;if(i<n)s.className='on';el.appendChild(s);} }

function startRound(){
  q=0; queue=shuffle(KEYS).slice(0,ROUND);
  if(mode==='mem') return startMemory();
  drawStars(0,ROUND); ask();
}
function ask(){
  locked=false; const k=queue[q];
  const others=shuffle(KEYS.filter(x=>x!==k)).slice(0,nChoices-1);
  const opts=shuffle([k,...others]);
  const showPic=mode==='p2l';
  stage.innerHTML=`
    <p class="ask">${showPic?'Which letter does this start with?':'Which picture starts with this letter?'}</p>
    <div class="prompt" id="prompt">
      <img src="${showPic?DATA[k].pic:DATA[k].letter}" alt="${showPic?DATA[k].word:'Letter '+k}">
      <div class="word" id="word">${showPic?DATA[k].word:''}</div>
      <button class="say" id="say" type="button" aria-label="Say it">Say it</button>
    </div>
    <div class="choices" id="choices">${opts.map(o=>`<div class="choice" tabindex="0" role="button" data-k="${o}" aria-label="${showPic?'Letter '+o:DATA[o].word}"><img src="${showPic?DATA[o].letter:DATA[o].pic}" alt=""></div>`).join('')}</div>`;
  $('#say').onclick=()=>say(showPic?DATA[k].word:k);
  stage.querySelectorAll('.choice').forEach(c=>wireChoice(c,k));
}
function wireChoice(el,k){
  let start=null, moved=false;
  el.addEventListener('pointerdown',e=>{ if(locked||el.classList.contains('wrong')) return; start={x:e.clientX,y:e.clientY}; moved=false; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove',e=>{ if(!start) return; const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(!moved&&Math.hypot(dx,dy)>8){moved=true;el.classList.add('dragging');}
    if(moved){el.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`; $('#prompt').classList.toggle('hot',overPrompt(e));} });
  const end=e=>{ if(!start) return; const wasDrag=moved; start=null; el.classList.remove('dragging'); el.style.transform=''; $('#prompt').classList.remove('hot');
    if(!wasDrag||overPrompt(e)) choose(el,k); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',()=>{start=null;el.classList.remove('dragging');el.style.transform='';});
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el,k);} });
}
function overPrompt(e){const r=$('#prompt').getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;}
function choose(el,k){
  if(locked||el.classList.contains('wrong')) return;
  if(el.dataset.k===k){
    locked=true; el.classList.add('right'); const p=$('#prompt'); p.classList.add('yay');
    $('#word').textContent=sentence(k); cheer(); say(sentence(k));
    q++; drawStars(q,ROUND);
    setTimeout(()=>{ q>=ROUND?finish():ask(); },1700);
  } else { el.classList.add('wrong'); blip(220,.18,'sine'); }
}
function finish(msg){
  stage.innerHTML=`<div class="win"><h2>Great job!</h2><p>${msg||'You matched 10 letters and pictures.'}</p><button id="again" type="button" aria-pressed="true">Play again</button></div>`;
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.25),i*120));
  $('#again').onclick=startRound; $('#again').focus();
}
// Memory: 6 letter cards + their 6 pictures, face down
function startMemory(){
  const ks=shuffle(KEYS).slice(0,6); let found=0, open=[];
  drawStars(0,6);
  const cards=shuffle(ks.flatMap(k=>[{k,t:'letter'},{k,t:'pic'}]));
  stage.innerHTML=`<p class="ask">Flip two cards. Find each letter and its picture!</p>
    <div class="grid">${cards.map((c,i)=>`<button class="mcard" type="button" data-k="${c.k}" aria-label="Card ${i+1}"><div class="in"><div class="face back"><span>?</span></div><div class="face front"><img src="${c.t==='letter'?DATA[c.k].letter:DATA[c.k].pic}" alt="${c.t==='letter'?'Letter '+c.k:DATA[c.k].word}"></div></div></button>`).join('')}</div>`;
  stage.querySelectorAll('.mcard').forEach(b=>b.addEventListener('click',()=>{
    if(b.classList.contains('open')||b.classList.contains('done')||open.length===2) return;
    b.classList.add('open'); blip(600,.07); open.push(b);
    if(open.length===2){
      const [a,c]=open;
      if(a.dataset.k===c.dataset.k){ setTimeout(()=>{a.classList.add('done');c.classList.add('done');a.classList.remove('open');c.classList.remove('open');
          open=[];found++;drawStars(found,6);cheer();say(sentence(a.dataset.k)); if(found===6) setTimeout(()=>finish('You found all 6 pairs.'),1600);},450); }
      else { setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');open=[];blip(260,.12,'sine');},1100); }
    }
  }));
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('#level').hidden=mode==='mem'; startRound();
}));
$('#level').onclick=()=>{nChoices=nChoices===3?4:3;$('#level').textContent=nChoices+' choices';startRound();};
$('#sound').onclick=()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',sound);$('#sound').textContent=sound?'Sound on':'Sound off';if(!sound)try{speechSynthesis.cancel()}catch(_){}};
startRound();
</script>

</body></html>
