  --mat:#2E2620; --mat-line:#3B3129; --ink:#F6EBD9; --ink-soft:#CDB896;
  --btn:#3E342B; --btn-ink:#F6EBD9; --accent:#FFB347; --accent-ink:#2B2D42;

:root[data-theme="dark"]{
  --mat:#2E2620; --mat-line:#3B3129; --ink:#F6EBD9; --ink-soft:#CDB896;
  --btn:#3E342B; --btn-ink:#F6EBD9; --accent:#FFB347; --accent-ink:#2B2D42;
  --board:#3A3028; --board-line:#6E5A42; --good:#5DD48A; color-scheme:dark}
html,body{height:100%}
body{background:var(--mat);color:var(--ink);font-family:var(--body);
  background-image:repeating-linear-gradient(178deg,transparent 0 34px,var(--mat-line) 34px 37px,transparent 37px 71px);
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.01em;text-wrap:balance}
.count{font-family:var(--display);font-weight:500;color:var(--ink-soft);font-size:17px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--display);font-weight:600;font-size:17px;border:3px solid var(--ink);border-radius:999px;
  padding:8px 18px;background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button.primary{background:var(--accent);color:var(--accent-ink)}
#wrap{flex:1;min-height:0;position:relative;margin-top:10px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#win .card{pointer-events:auto;background:var(--btn);border:4px solid var(--ink);border-radius:28px;padding:22px 30px;text-align:center;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:12px;align-items:center}
#win h2{font-family:var(--display);font-size:clamp(28px,6vw,44px);margin:0;color:var(--ink)}
#win p{margin:0;font-size:17px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

/* Home button: same bold look in every game */
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;line-height:1;
  text-decoration:none;color:#2B2D42;background:#36CEDC;border:3px solid #2B2D42;border-radius:999px;padding:9px 18px 9px 14px;
  box-shadow:0 4px 0 #2B2D42;touch-action:manipulation}
.home:hover{background:#5ADAE5}
.home:active{transform:translateY(3px);box-shadow:0 1px 0 #2B2D42}
.home:focus-visible{outline:3px solid #FF9F1C;outline-offset:3px}

const COLS=3, ROWS=4, IW=1200, IH=1200, PW=IW/COLS, PH=IH/ROWS, TAB=Math.min(PW,PH)*0.2;
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
const img=new Image(); img.src=IMG_SRC;
let pieces=[], world={w:0,h:0,bx:0,by:0}, scale=1, ox=0, oy=0, drag=null, peek=false, done=false, confetti=[];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// edges: 0 flat, 1 tab out, -1 tab in. right/bottom edges stored; left/top derive from neighbour
function makeEdges(){
  const H=[],V=[];
  for(let r=0;r<ROWS;r++){H[r]=[];V[r]=[];for(let c=0;c<COLS;c++){H[r][c]=Math.random()<.5?1:-1;V[r][c]=Math.random()<.5?1:-1;}}
  return {H,V};
}
function edgeTo(p,x0,y0,x1,y1,s){ // draw side from (x0,y0) to (x1,y1), tab bulging to the left-hand normal * s
  if(!s){p.lineTo(x1,y1);return}
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=uy*s, ny=-ux*s;
  const P=(a,b)=>[x0+ux*a*L+nx*b*TAB, y0+uy*a*L+ny*b*TAB];
  const pts=[[.34,0],[.40,-.10],[.36,.55],[.40,1.05],[.50,1.15],[.60,1.05],[.64,.55],[.60,-.10],[.66,0]];
  let a=P(.34,0); p.lineTo(a[0],a[1]);
  let q;
  q=[P(.40,-.15),P(.30,.65),P(.42,.95)]; p.bezierCurveTo(...q[0],...q[1],...q[2]);
  q=[P(.47,1.12),P(.53,1.12),P(.58,.95)]; p.bezierCurveTo(...q[0],...q[1],...q[2]);
  q=[P(.70,.65),P(.60,-.15),P(.66,0)]; p.bezierCurveTo(...q[0],...q[1],...q[2]);
  p.lineTo(x1,y1);
}
function piecePath(pc){
  const p=new Path2D(); p.moveTo(0,0);
  edgeTo(p,0,0,PW,0,pc.top); edgeTo(p,PW,0,PW,PH,pc.right); edgeTo(p,PW,PH,0,PH,pc.bottom); edgeTo(p,0,PH,0,0,pc.left);
  p.closePath(); return p;
}
function build(){
  const {H,V}=makeEdges(); pieces=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    // side "outward" sign: positive = bulge outward. edgeTo bulges to left normal; going clockwise, left normal points outward.
    const pc={r,c,
      top: r===0?0:-H[r-1][c], bottom: r===ROWS-1?0:H[r][c],
      left: c===0?0:-V[r][c-1], right: c===COLS-1?0:V[r][c],
      x:0,y:0,placed:false};
    pc.path=piecePath(pc);
    // pre-render the piece to its own canvas for fast drawing
    const m=TAB*1.4, off=document.createElement('canvas'); off.width=PW+2*m; off.height=PH+2*m;
    const o=off.getContext('2d'); o.translate(m,m); o.save(); o.clip(pc.path);
    o.drawImage(img,-c*PW,-r*PH,IW,IH); o.restore();
    pc.sprite=off; pc.m=m; pieces.push(pc);
  }
}
function layout(){
  const W=wrap.clientWidth, Hh=wrap.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=Hh*dpr;
  const wide=W/Hh>1.05;
  world = wide ? {w:IW*2.05,h:IH*1.12,bx:IW*.525,by:IH*.06,wide} : {w:IW*1.12,h:IH*2.1,bx:IW*.06,by:IW*.04,wide};
  scale=Math.min(W/world.w,Hh/world.h); ox=(W-world.w*scale)/2; oy=(Hh-world.h*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
}
function scatter(){
  const spots=[];
  if(world.wide){ // columns left and right of the board
    for(let i=0;i<12;i++){const side=i%2, k=Math.floor(i/2);
      spots.push([side? world.bx+IW+TAB*1.2+(k%2)*(PW*.55)+Math.random()*20 : TAB*1.0+(k%2)*(PW*.55)+Math.random()*20,
                  TAB*.6+ (k/6)*(world.h-PH-TAB*1.4)+Math.random()*25]);}
  } else { // tray under the board
    const ty=world.by+IH+TAB*1.6;
    for(let i=0;i<12;i++){const c=i%4, r=Math.floor(i/4);
      spots.push([TAB*.6+c*(world.w-PW-TAB*1.2)/3+Math.random()*15, ty+r*(world.h-ty-PH-TAB)/2+Math.random()*15]);}
  }
  spots.sort(()=>Math.random()-.5);
  pieces.forEach((p,i)=>{p.placed=false;p.x=spots[i][0];p.y=spots[i][1];});
  pieces.sort(()=>Math.random()-.5);
  done=false; confetti=[]; document.getElementById('win').hidden=true; updateCount();
}
function updateCount(){const n=pieces.filter(p=>p.placed).length;document.getElementById('count').textContent=n+' of 12 pieces placed';}
function draw(){
  const dpr=window.devicePixelRatio||1;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  // board
  ctx.fillStyle=css('--board'); ctx.strokeStyle=css('--board-line'); ctx.lineWidth=6;
  roundRect(world.bx-10,world.by-10,IW+20,IH+20,26); ctx.fill(); ctx.stroke();
  if(peek){ctx.globalAlpha=.35; ctx.drawImage(img,world.bx,world.by,IW,IH); ctx.globalAlpha=1;}
  // slot outlines
  ctx.lineWidth=3; ctx.setLineDash([10,10]); ctx.strokeStyle=css('--board-line');
  pieces.forEach(p=>{ if(p.placed) return; ctx.save(); ctx.translate(world.bx+p.c*PW,world.by+p.r*PH); ctx.stroke(p.path); ctx.restore();});
  ctx.setLineDash([]);
  // placed first, loose on top (array order = z order)
  const order=[...pieces.filter(p=>p.placed),...pieces.filter(p=>!p.placed)];
  for(const p of order){
    ctx.save(); ctx.translate(p.x,p.y);
    if(!p.placed){ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=p===drag?.p?24:10; ctx.shadowOffsetY=p===drag?.p?10:4;}
    ctx.drawImage(p.sprite,-p.m,-p.m);
    ctx.shadowColor='transparent';
    if(!done){ctx.lineWidth=p.placed?1.5:4; ctx.strokeStyle=p.placed?'rgba(0,0,0,.18)':'#FFFFFF'; ctx.stroke(p.path);}
    ctx.restore();
  }
  // confetti
  for(const f of confetti){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.fillStyle=f.c;ctx.fillRect(-f.s/2,-f.s/4,f.s,f.s/2);ctx.restore();}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function toWorld(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left-ox)/scale,(e.clientY-b.top-oy)/scale];}
const hit=document.createElement('canvas').getContext('2d');
function pick(x,y){
  const loose=pieces.filter(p=>!p.placed);
  for(let i=loose.length-1;i>=0;i--){const p=loose[i];
    hit.lineWidth=TAB*.6; if(hit.isPointInPath(p.path,x-p.x,y-p.y)||hit.isPointInStroke(p.path,x-p.x,y-p.y)) return p;}
  return null;
}
let actx=null;
function blip(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(_){}}
cv.addEventListener('pointerdown',e=>{
  if(done) return; const [x,y]=toWorld(e); const p=pick(x,y); if(!p) return;
  cv.setPointerCapture(e.pointerId); drag={p,dx:x-p.x,dy:y-p.y};
  pieces.splice(pieces.indexOf(p),1); pieces.push(p); blip(520,.08); draw();
});
cv.addEventListener('pointermove',e=>{
  if(!drag){const [x,y]=toWorld(e); cv.style.cursor=pick(x,y)?'grab':'default'; return;}
  const [x,y]=toWorld(e); drag.p.x=x-drag.dx; drag.p.y=y-drag.dy; cv.style.cursor='grabbing'; draw();
});
function drop(){
  if(!drag) return; const p=drag.p; drag=null;
  const tx=world.bx+p.c*PW, ty=world.by+p.r*PH;
  if(Math.hypot(p.x-tx,p.y-ty)<Math.min(PW,PH)*0.28){p.x=tx;p.y=ty;p.placed=true;blip(880,.18);setTimeout(()=>blip(1175,.2),90);}
  else blip(330,.06);
  // keep loose pieces inside the play mat
  p.x=Math.max(-TAB*.5,Math.min(world.w-PW+TAB*.5,p.x)); p.y=Math.max(-TAB*.5,Math.min(world.h-PH+TAB*.5,p.y));
  updateCount(); draw();
  if(pieces.every(q=>q.placed)) win();
}
cv.addEventListener('pointerup',drop); cv.addEventListener('pointercancel',drop);
function win(){
  done=true; draw();
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.25),i*120));
  const cols=['#E8352B','#FF9F1C','#FFD23F','#3DB86A','#2EC4B6','#3F6CFF','#8E44AD','#F7A8B8'];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    confetti=Array.from({length:140},()=>({x:world.bx+Math.random()*IW,y:world.by-50-Math.random()*400,vx:(Math.random()-.5)*6,vy:3+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.3,s:18+Math.random()*16,c:cols[Math.floor(Math.random()*8)]}));
    let t=0;(function step(){t++;confetti.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.a+=f.va;});draw();if(t<220&&done)requestAnimationFrame(step);else{confetti=[];draw();}})();
  }
  setTimeout(()=>{document.getElementById('win').hidden=false;document.getElementById('again').focus();},reduce?200:900);
}
const peekBtn=document.getElementById('peek');
peekBtn.addEventListener('click',()=>{peek=!peek;peekBtn.setAttribute('aria-pressed',peek);peekBtn.textContent=peek?'Hide peek':'Peek';draw();});
document.getElementById('shuffle').addEventListener('click',()=>{scatter();draw();});
document.getElementById('again').addEventListener('click',()=>{build();scatter();draw();});
addEventListener('resize',()=>{const was=world.wide;layout();if(was!==world.wide)scatter();draw();});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
img.onload=()=>{layout();build();scatter();draw();};
</script>
