{t:'Mail it at the post office',say:'Off to the post office!',i:POM+'<rect x="14" y="8" width="16" height="16" rx="2" fill="#8E44AD"/><rect x="20" y="8" width="4" height="16" fill="#E63946"/>',ok:{move:{robo:'translate(480px,200px) scale(.75)',pres:'translate(512px,204px)'},after:{move:MV('pres','translate(590px,204px)'),after:{hide:['pres']}}},bug:{t:'Wait! The present needs a bow first!',fx:{show:['q']}}},
{t:'Friend opens it',say:'Here it comes!',i:FR,ok:{show:['thanks']},bug:{t:'Your friend has no gift yet! Mail it first.',fx:{show:['q']}}}]}];
const DIFF={1:{n:'Easy',s:'★',c:'#8FE968'},2:{n:'Medium',s:'★★',c:'#FFB750'},3:{n:'Hard',s:'★★★',c:'#FE797B'}};
let L=null,LI=0,order=[],tray=[],running=false,marks={},sound=true,ac=null;
function snd(type){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime;const seq=type==='drop'?[[520,0,.08],[780,.07,.12]]:type==='fail'?[[392,0,.22],[349,.22,.22],[294,.44,.45]]:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.4]];seq.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type==='fail'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(type==='fail'?.06:.2,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.connect(g).connect(ac.destination);o.start(n+t);o.stop(n+t+d+.05)})}catch(e){}}
function renderLevels(){$('levels').innerHTML=LV.map((l,i)=>{const d=DIFF[l.d];return `<button class="lv" data-l="${i}" aria-pressed="${i===LI}" aria-label="Level ${i+1}: ${l.name}, ${d.n}" title="${l.name} (${d.n})"><span class="n" style="background:${d.c}">${i+1}</span><span aria-hidden="true">${d.s}</span></button>`}).join('')}
$('levels').addEventListener('click',e=>{const b=e.target.closest('.lv');if(b)start(+b.dataset.l)});
function start(i){LI=i;L=LV[i];order=L.steps.map(()=>null);tray=shuffle(L.steps.map((_,j)=>j));marks={};running=false;$('title').textContent=L.name;renderLevels();resetScene();msg("Tap the cards to put Robo's steps in order.");render()}
function shuffle(x){x=x.slice();do{for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}}while(x.every((v,i)=>v===i));return x}
const tile=j=>{const s=L.steps[j];return `<div class="tile" style="border-color:${PB[j%6]};font-size:${L.steps.length>5?12:14}px"><svg viewBox="2 0 60 58" aria-hidden="true">${s.i}</svg><span class="lb">${s.t}</span></div>`};
const BADGE={active:'<span class="badge" style="background:#36CEDC"><i class="ti ti-player-play"></i></span>',bad:'<span class="badge" style="background:#FFEA56"><i class="ti ti-x"></i></span>',good:'<span class="badge" style="background:#fff"><i class="ti ti-check"></i></span>'};
function render(){const n=L.steps.length,cols=`repeat(${n},minmax(0,1fr)) 86px`;$('slots').style.gridTemplateColumns=cols;$('trow').style.gridTemplateColumns=cols;$('tray').style.gridColumn='1/'+(n+1);$('tray').style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
$('slots').innerHTML=order.map((k,i)=>`<div class="slot${marks[i]?' '+marks[i]:''}" data-i="${i}"><span class="num">${i+1}</span>${marks[i]?BADGE[marks[i]]:''}${k!==null?tile(k):''}</div>`).join('')+'<button id="run"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#2B2D42"/></svg>Run</button>';
$('run').addEventListener('click',run);$('tray').innerHTML=tray.map(j=>`<div data-k="${j}">${tile(j)}</div>`).join('')}
function msg(t,c,next){$('msg').innerHTML='';const s=document.createElement('span');s.textContent=t;s.style.color=c||'#2B2D42';$('msg').appendChild(s);if(next&&LI<LV.length-1){const b=document.createElement('button');b.innerHTML='Next level <i class="ti ti-arrow-right" aria-hidden="true"></i>';b.onclick=()=>start(LI+1);$('msg').appendChild(b)}}
function say(t){const b=$('bubble');if(b)b.textContent=t}
function op(id,v){const e=$(id);if(e)e.style.opacity=v}
function face(h){$('mouth').setAttribute('d',h?'M-8 -115 q8 7 16 0':'M-8 -110 q8 -7 16 0')}
function resetScene(){$('scene').innerHTML=L.svg();say(L.hello)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fx(f){if(!f)return;(f.hide||[]).forEach(id=>op(id,0));(f.show||[]).forEach(id=>op(id,1));for(const id in(f.move||{})){const e=$(id);if(e)e.style.transform=f.move[id]}if(f.after){await wait(1000);await fx(f.after)}}
$('tray').addEventListener('click',e=>{const c=e.target.closest('[data-k]');if(!c||running)return;const i=order.indexOf(null);if(i<0)return;const k=+c.dataset.k;order[i]=k;tray.splice(tray.indexOf(k),1);snd('drop');marks={};resetScene();msg(order.includes(null)?'Keep going! What comes next?':'All steps are ready. Tap Run!');render()});
$('slots').addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s||running)return;const i=+s.dataset.i;if(order[i]===null)return;tray.push(order[i]);order[i]=null;marks={};resetScene();msg('Pick a card to put back in.');render()});
async function run(){if(running)return;const n=L.steps.length;
if(order.includes(null)){msg('Robo needs all '+n+' steps first!','#B5202B');snd('fail');return}
running=true;marks={};resetScene();render();msg('Robo is following the algorithm...');const done=new Set(),lvl=L;await wait(500);
for(let i=0;i<n;i++){if(L!==lvl)return;marks={[i]:'active'};render();const k=order[i],st=L.steps[k];let miss=-1;for(let j=0;j<k;j++)if(!done.has(j)){miss=j;break}
say(st.say);let bug=null;
if(miss<0){await fx(st.ok);done.add(k)}else if(miss===k-1){await fx(st.bug.fx);bug=st.bug.t}else{op('q',1);bug='Oops! Robo can\'t "'+st.t+'" yet. "'+L.steps[miss].t+'" comes first!'}
if(L!==lvl)return;
if(bug){await wait(700);marks={[i]:'bad'};render();face(false);msg(bug,'#B5202B');snd('fail');running=false;return}
await wait(1200)}
marks={};order.forEach((_,i)=>marks[i]='good');render();say(L.win);msg('Hooray! Your algorithm worked!','#1F7A3F',true);snd('success');running=false}
$('reset').addEventListener('click',()=>{if(!running&&L)start(LI)});
$('sound').addEventListener('click',()=>{sound=!sound;const b=$('sound');b.setAttribute('aria-pressed',sound);b.setAttribute('aria-label',sound?'Sound on':'Sound off');b.title=sound?'Sound on':'Sound off'});
start(0);
</script></div></body></html>
